name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clauselens
          POSTGRES_PASSWORD: clauselens
          POSTGRES_DB: clauselens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clauselens -d clauselens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clauselens:clauselens@localhost:5432/clauselens

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations (validates the schema against real Postgres)
        run: npm run db:migrate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
